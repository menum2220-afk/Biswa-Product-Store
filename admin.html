<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BISWA MODS ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110d;color:#eafff1;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}
h1{margin:0 0 5px}.muted{color:#88a893;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.stat,.card{background:#0d1d14;border:1px solid #1d5735;border-radius:16px;padding:16px}.stat b{font-size:25px;display:block;margin-top:6px}
button{border:0;border-radius:10px;padding:10px 13px;background:#18a957;color:white;font-weight:700;cursor:pointer;margin:4px}button.red{background:#9b3030}button.dark{background:#123d27}
input,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #28553a;background:#07110d;color:#fff;margin:5px 0}textarea{min-height:75px}
.login{max-width:400px;margin:15vh auto}.hidden{display:none}.order{margin:12px 0}.shot{max-width:260px;max-height:300px;border-radius:10px;display:block;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body><div class="wrap">
<section id="login" class="login card">
<h1>🔐 Admin Login</h1><p class="muted">Firebase Authentication email/password use hoga.</p>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button><p id="loginMsg"></p>
</section>
<section id="panel" class="hidden">
<div class="top"><div><h1>🛒 BISWA MODS ADMIN</h1><div class="muted">Orders & manual key delivery</div></div><button id="logout" class="dark">Logout</button></div>
<div class="grid">
<div class="stat">Total Orders<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Approved<b id="approved">0</b></div><div class="stat">Rejected<b id="rejected">0</b></div>
</div>
<h2>📦 Orders</h2><div id="orders"></div>
</section>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const firebaseConfig={
 apiKey:"AIzaSyDI3RApVY98KNDRQS0QbWgguuD7zq4OPwo",
 authDomain:"biswamodsstore.firebaseapp.com",
 projectId:"biswamodsstore",
 storageBucket:"biswamodsstore.firebasestorage.app",
 messagingSenderId:"195493411755",
 appId:"1:195493411755:web:01124cc4986160f707b0ee"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const $=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Logging in...";
 try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(e){$("loginMsg").textContent=e.message}
};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 $("login").classList.toggle("hidden",!!user);$("panel").classList.toggle("hidden",!user);
 if(user)loadOrders();
});
function loadOrders(){
 onValue(ref(db,"orders"),snap=>{
  const data=snap.val()||{},list=Object.values(data).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $("total").textContent=list.length;$("pending").textContent=list.filter(o=>o.orderStatus==="pending").length;
  $("approved").textContent=list.filter(o=>o.orderStatus==="approved").length;$("rejected").textContent=list.filter(o=>o.orderStatus==="rejected").length;
  $("orders").innerHTML="";
  if(!list.length){$("orders").innerHTML='<div class="card">No orders yet.</div>';return}
  list.forEach(o=>{
   const d=document.createElement("div");d.className="card order";
   d.innerHTML=`<b>#${o.orderId}</b><p>📦 ${o.product}<br>⏳ ${o.plan}<br>💰 ₹${o.amount}<br>📌 ${o.orderStatus}</p>
   <img class="shot" src="${o.screenshot}" alt="Payment screenshot">
   <label>🔑 Product Key<input id="key_${o.orderId}" value="${o.key||""}" placeholder="Enter key"></label>
   <label>📥 Download Link<input id="link_${o.orderId}" value="${o.downloadLink||""}" placeholder="https://..."></label>
   <button onclick="approve('${o.orderId}')">✅ Approve</button>
   <button class="red" onclick="rejectOrder('${o.orderId}')">❌ Reject</button>`;
   $("orders").appendChild(d);
  });
 });
}
window.approve=async id=>{
 const key=$("key_"+id).value.trim(),link=$("link_"+id).value.trim();
 if(!key){alert("Product key enter karo.");return}
 await update(ref(db,"orders/"+id),{orderStatus:"approved",paymentStatus:"approved",key,downloadLink:link,approvedAt:Date.now()});
 alert("Order approved.");
};
window.rejectOrder=async id=>{
 const reason=prompt("Reject reason (optional):")||"Payment not verified";
 await update(ref(db,"orders/"+id),{orderStatus:"rejected",paymentStatus:"rejected",rejectReason:reason,rejectedAt:Date.now()});
 alert("Order rejected.");
};
</script></body></html>
