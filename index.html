<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BISWA MODS STORE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#010604;color:#effff5;font:14px system-ui,-apple-system,Segoe UI,Arial}
body{overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#020705}.bg video{width:100%;height:100%;object-fit:cover;filter:brightness(.34) saturate(1.15);opacity:.72}.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 5%,#2cff891b,transparent 35%),linear-gradient(#02070555,#020705ee)}
.app{max-width:680px;margin:auto;min-height:100vh;background:#031008a8;backdrop-filter:blur(8px);border-left:1px solid #123d25;border-right:1px solid #123d25}
.top{position:sticky;top:0;z-index:8;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#020b06e8;border-bottom:1px solid #1c5734;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:9px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#42ff97,#08783f);box-shadow:0 0 28px #25ed7a33}.brand b{font-size:13px}.brand small{display:block;color:#789987;font-size:9px}
.balance{border:1px solid #2b7047;border-radius:12px;background:#081b10;padding:7px 9px;text-align:right;cursor:pointer}.balance small{color:#789987;font-size:9px}.balance b{display:block;color:#78ffb0}
.view{padding:13px 11px 88px}.hero,.card{border:1px solid #1c5433;border-radius:20px;background:linear-gradient(145deg,#0b1c11e8,#04100ae8);box-shadow:0 12px 36px #0009;padding:15px;margin:10px 0}
.hero{padding:20px}.hero h1{margin:3px 0 8px;font-size:25px}.muted{color:#83a594;font-size:11px}.tag{display:inline-block;padding:4px 8px;border-radius:30px;background:#0e3b23;color:#77ffae;font-size:9px;font-weight:900;margin:2px}
.btn{width:100%;border:0;border-radius:12px;padding:12px;margin:4px 0;color:#fff;font-weight:900;background:linear-gradient(135deg,#20df75,#0a964b);cursor:pointer}.btn.alt{background:#0c2818;border:1px solid #286744}.btn.red{background:#6b252d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plan{border:1px solid #205b38;border-radius:14px;background:#07150c;padding:13px;cursor:pointer;transition:.18s}.plan:active{transform:scale(.98)}.price{color:#76ffad;font-weight:900}
.chat{display:flex;gap:8px;align-items:flex-start;margin:10px 0}.botdot{width:30px;height:30px;flex:none;border-radius:10px;background:#0e4526;display:grid;place-items:center}.bubble{background:#0a1d11;border:1px solid #1d5031;border-radius:4px 15px 15px 15px;padding:10px 12px;max-width:88%;box-shadow:0 7px 20px #0006}.typing span{display:inline-block;width:5px;height:5px;background:#76ffad;border-radius:50%;margin:0 2px;animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.file{display:block;text-align:center;padding:13px;border:1px dashed #398359;border-radius:13px;color:#91e9b0;margin:7px 0;cursor:pointer}.file input{display:none}.preview{display:none;width:100%;max-height:270px;object-fit:contain;background:#fff;border-radius:13px}.input{width:100%;padding:11px;background:#050d08;color:#fff;border:1px solid #275d3d;border-radius:11px;margin:4px 0}
.status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900}.pending{background:#5b4711;color:#ffe28b}.approved{background:#104d2b;color:#7affad}.rejected{background:#5c2027;color:#ff9da4}
.qr{display:block;width:min(100%,360px);margin:12px auto;padding:8px;background:white;border-radius:16px}.notice{border-left:3px solid #34f183;padding:8px 10px;background:#0a1d11;border-radius:8px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);z-index:9;padding:7px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#020906f5;border-top:1px solid #17482d;backdrop-filter:blur(18px)}.nav button{border:0;border-radius:11px;background:#07170d;color:#7f9d8b;padding:7px 2px;font-size:8px;font-weight:900}.nav button.on{background:#124528;color:#fff}
.toast{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 14px;border-radius:12px;background:#0c2918;border:1px solid #2e7e4d;box-shadow:0 10px 30px #0009}.hide{display:none!important}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.order{transition:.2s}.order.removing{opacity:0;transform:translateX(30px);max-height:0;overflow:hidden;margin:0;padding:0}
@media(max-width:420px){.grid{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style>
</head>
<body>
<div class="bg"><video id="bgv" src="video.mp4" autoplay muted loop playsinline></video></div>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🛒</div><div><b>BISWA MODS STORE</b><small id="sub">Fast • Secure • Premium</small></div></div><div class="balance" id="balBtn"><small>Balance</small><b id="balance">₹0</b></div></header>
<main id="view" class="view"></main>
<div id="toast" class="toast"></div>
<nav class="nav">
<button data-p="home">⌂<br>Home</button><button data-p="shop">🛒<br>Shop</button><button data-p="orders">📦<br>Orders</button><button data-p="wallet">💰<br>Wallet</button><button data-p="inbox">💬<br>Chat</button><button data-p="help">☎<br>Help</button>
</nav>
</div>
<audio id="sound" src="ambient.mp3" loop preload="auto"></audio>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getDatabase,ref,onValue,get,push,update,query,orderByChild,equalTo}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDI3RApVY98KNDRQS0QbWgguuD7zq4OPwo",
  authDomain: "biswamodsstore.firebaseapp.com",
  databaseURL: "https://biswamodsstore-default-rtdb.firebaseio.com",
  projectId: "biswamodsstore",
  storageBucket: "biswamodsstore.firebasestorage.app",
  messagingSenderId: "195493411755",
  appId: "1:195493411755:web:01124cc4986160f707b0ee"
};
const DEFAULT_PRODUCTS = {
  biswa_mods_product: {id:"biswa_mods_product", name:"BISWA MODS PRODUCT", icon:"🔥", sub:"Premium access", enabled:true,
    plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},
  biswa_mods_product_v2: {id:"biswa_mods_product_v2", name:"BISWA MODS PRODUCT V2", icon:"⚡", sub:"V2 premium access", enabled:true,
    plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},
  biswa_product: {id:"biswa_product", name:"BISWA PRODUCT", icon:"💎", sub:"Long duration", enabled:true,
    plans:[["3 Days",50],["8 Days",100],["15 Days",150],["30 Days",270]]}
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const view=document.getElementById("view"),audio=document.getElementById("sound"),bal=document.getElementById("balance");
let products={},settings={storeName:"BISWA MODS STORE",upi:"7099517202-ve6a@ybl",whatsapp:"7099517202",announcement:"Welcome to BISWA MODS STORE!",maintenance:false};
let userId="",wallet=0;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const toast=t=>{const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)};
function nav(n){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===n))}
function beep(){audio.volume=.08;audio.play().catch(()=>{});navigator.vibrate?.(12)}
document.addEventListener("click",e=>{if(e.target.closest("button,.plan,.balance,.file"))beep()},{once:true});
function typeBubble(text,cb){view.innerHTML=`<div class="chat"><div class="botdot">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div></div>`;setTimeout(()=>{view.innerHTML=`<div class="chat"><div class="botdot">🤖</div><div class="bubble fade">${text}</div></div>`;cb?.()},650)}
async function init(){
 const c=await signInAnonymously(auth);userId=c.user.uid;
 const u=ref(db,"users/"+userId);const us=await get(u);
 if(!us.exists())await update(u,{createdAt:Date.now(),balance:0});
 onValue(ref(db,"users/"+userId+"/balance"),s=>{wallet=Number(s.val()||0);bal.textContent=money(wallet)});
 onValue(ref(db,"products"),s=>{products=s.exists()?s.val():DEFAULT_PRODUCTS});
 onValue(ref(db,"settings"),s=>{settings={...settings,...(s.val()||{})};document.getElementById("sub").textContent=settings.maintenance?"Maintenance mode":"Fast • Secure • Premium"});
 home();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>window[b.dataset.p]());
document.getElementById("balBtn").onclick=walletPage;
function home(){nav("home");typeBubble(`👋 Welcome to <b>${esc(settings.storeName)}</b>!<br><span class="muted">${esc(settings.announcement)}</span><br><br>🛒 Select a product, choose a plan and checkout. You can also keep approved balance and use it later.`,()=>{view.innerHTML+=`<div class="hero fade"><span class="tag">LIVE STORE</span><span class="tag">ANONYMOUS LOGIN</span><h1>Premium access, simple checkout.</h1><button class="btn" onclick="shop()">🛒 Browse Products</button><button class="btn alt" onclick="walletPage()">💰 Add / View Balance</button></div><div class="card"><b>✨ How it works</b><p class="muted">1. Choose plan → 2. Pay by PhonePe or approved balance → 3. Submit proof if paying by QR → 4. Admin verifies → 5. Your private order chat gets the key.</p></div>`})}
function shop(){nav("shop");let a=Object.values(products).filter(p=>p.enabled!==false);view.innerHTML=`<div class="hero fade"><span class="tag">SHOP</span><h1>🛍️ Choose Product</h1><p class="muted">Live products are controlled from Admin Panel.</p></div>`+a.map(p=>`<div class="card fade"><div style="font-size:20px">${esc(p.icon||"📦")} <b>${esc(p.name)}</b></div><p class="muted">${esc(p.sub||"Premium access")}</p><button class="btn" onclick='plans(${JSON.stringify(p.id)})'>View Plans</button></div>`).join("")}
window.shop=shop;
function plans(id){nav("shop");const p=products[id];view.innerHTML=`<button class="btn alt" onclick="shop()">← Back</button><div class="hero fade"><h1>${esc(p.icon||"📦")} ${esc(p.name)}</h1><p class="muted">${esc(p.sub||"Choose your plan")}</p></div><div class="grid">${(p.plans||[]).map((x,i)=>`<div class="plan fade" onclick='checkout(${JSON.stringify(id)},${i})'>⏳ <b>${esc(x[0])}</b><br><span class="price">${money(x[1])}</span><br><small class="muted">Tap to continue</small></div>`).join("")}</div>`}
window.plans=plans;
function checkout(id,i){const p=products[id],x=p.plans[i];nav("shop");view.innerHTML=`<button class="btn alt" onclick='plans(${JSON.stringify(id)})'>← Change Plan</button><div class="hero fade"><span class="tag">CHECKOUT</span><h1>🧾 Order Summary</h1><p class="muted">📦 ${esc(p.name)}<br>⏳ ${esc(x[0])}<br>💰 <b class="price">${money(x[1])}</b></p><div class="notice">💰 Your approved balance: <b>${money(wallet)}</b></div><button class="btn" id="buybal">⚡ Buy with Balance</button><button class="btn alt" id="payqr">📱 Pay with PhonePe QR</button></div>`;document.getElementById("buybal").onclick=()=>balanceBuy(p,x);document.getElementById("payqr").onclick=()=>qrPay(p,x)}
async function balanceBuy(p,x){
 if(wallet<Number(x[1]))return toast("Insufficient balance. Add balance first.");
 const r=push(ref(db,"orders"));await update(ref(db),{["orders/"+r.key]:{orderId:r.key,userId,productId:p.id,product:p.name,plan:x[0],amount:Number(x[1]),paymentMethod:"balance",orderStatus:"pending_balance",paymentStatus:"balance_pending",createdAt:Date.now(),key:"",downloadLink:"",message:"Balance purchase requested. Admin will approve this order."},["userOrders/"+userId+"/"+r.key]:{orderId:r.key,userId,productId:p.id,product:p.name,plan:x[0],amount:Number(x[1]),paymentMethod:"balance",orderStatus:"pending_balance",paymentStatus:"balance_pending",createdAt:Date.now(),key:"",downloadLink:"",message:"Balance purchase requested. Admin will approve this order."}});
 view.innerHTML=`<div class="hero fade">✅ <h2>Balance Checkout Created</h2><p class="muted">Order <b>#${esc(r.key)}</b> is waiting for admin approval. No new QR payment is needed.</p><button class="btn" onclick="orders()">📦 View Order</button></div>`;
}
async function qrPay(p,x){nav("shop");view.innerHTML=`<button class="btn alt" onclick='checkout(${JSON.stringify(p.id)},${p.plans.findIndex(z=>z[0]===x[0])})'>← Back</button><div class="card fade"><h2>📱 PhonePe Payment</h2><p class="muted">Pay exactly <b class="price">${money(x[1])}</b> to the UPI below.</p><img class="qr" src="qr_code.png"><p style="text-align:center"><b>${esc(settings.upi)}</b></p><label class="file">📸 Select Payment Screenshot<input id="proof" type="file" accept="image/*"></label><img id="prev" class="preview"><button class="btn" id="submitProof">Submit Payment Proof</button></div>`;document.getElementById("proof").onchange=e=>preview(e.target.files[0]);document.getElementById("submitProof").onclick=()=>submitProof(p,x)}
function preview(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=document.getElementById("prev");im.src=r.result;im.style.display="block"};r.readAsDataURL(f)}
function compress(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image;im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,600/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.52))};im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}
async function submitProof(p,x){const f=document.getElementById("proof").files[0];if(!f)return toast("Screenshot select karo");if(f.size>10*1024*1024)return toast("Image too large");const btn=document.getElementById("submitProof");btn.disabled=true;btn.textContent="Uploading...";try{const image=await compress(f),r=push(ref(db,"orders"));const order={orderId:r.key,userId,productId:p.id,product:p.name,plan:x[0],amount:Number(x[1]),paymentMethod:"qr",paymentStatus:"pending",orderStatus:"pending",screenshot:image,createdAt:Date.now(),key:"",downloadLink:"",message:"Payment proof received. Waiting for verification."};await update(ref(db),{["orders/"+r.key]:order,["userOrders/"+userId+"/"+r.key]:order});view.innerHTML=`<div class="hero fade">✅ <h2>Payment Proof Submitted</h2><p class="muted">Order ID: <b>#${esc(r.key)}</b><br>Your private order chat will update after admin verification.</p><button class="btn" onclick="inbox()">💬 Open Order Chat</button></div>`}catch(e){console.error(e);toast("Upload failed");btn.disabled=false;btn.textContent="Submit Payment Proof"}}
async function orders(){nav("orders");view.innerHTML=`<div class="hero"><h1>📦 My Orders</h1><p class="muted">Only your orders are shown here.</p></div><div id="olist">Loading...</div>`;const s=await get(ref(db,"userOrders/"+userId));if(!s.exists()){document.getElementById("olist").innerHTML=`<div class="card">No orders yet.</div>`;return}renderOrders(Object.values(s.val()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)))}
function renderOrders(a){document.getElementById("olist").innerHTML=a.map(o=>{const c=o.orderStatus==="approved"?"approved":o.orderStatus==="rejected"?"rejected":"pending";return `<div class="card order fade"><b>#${esc(o.orderId)}</b> <span class="status ${c}">${esc((o.orderStatus||"pending").toUpperCase())}</span><p class="muted">📦 ${esc(o.product)}<br>⏳ ${esc(o.plan)}<br>💰 ${money(o.amount)}<br>💳 ${esc(o.paymentMethod||"qr")}</p>${o.key?`<div class="notice">🔑 <b>${esc(o.key)}</b></div>`:""}${o.downloadLink?`<a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" href="${esc(o.downloadLink)}">📥 Download</a>`:""}<button class="btn alt" onclick='openChat(${JSON.stringify(o.orderId)})'>💬 Open Order Chat</button></div>`}).join("")}
async function inbox(){nav("inbox");const s=await get(ref(db,"userOrders/"+userId));if(!s.exists()){view.innerHTML=`<div class="hero"><h1>💬 Order Chat</h1><p class="muted">No order messages yet.</p></div>`;return}const a=Object.values(s.val()).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));view.innerHTML=`<div class="hero"><h1>💬 Order Chat</h1><p class="muted">Private system messages for your orders.</p></div>`+a.map(o=>`<div class="card fade"><b>#${esc(o.orderId)}</b><div class="chat"><div class="botdot">🤖</div><div class="bubble">${o.message?esc(o.message):"No new message."}${o.key?`<hr><b>🔑 Key:</b> ${esc(o.key)}`:""}${o.downloadLink?`<br><a href="${esc(o.downloadLink)}" target="_blank">📥 Download</a>`:""}</div></div></div>`).join("")}
window.inbox=inbox;window.openChat=id=>{inbox();setTimeout(()=>{const q=[...document.querySelectorAll(".card")].find(x=>x.textContent.includes(id));q?.scrollIntoView({behavior:"smooth"})},100)}
async function walletPage(){nav("wallet");view.innerHTML=`<div class="hero fade"><span class="tag">WALLET</span><h1>💰 My Balance</h1><p class="muted">Available approved balance</p><div style="font-size:32px;color:#76ffad;font-weight:900">${money(wallet)}</div><button class="btn" onclick="addBalance()">➕ Add Balance</button></div><div class="card"><b>⚡ Use saved balance</b><p class="muted">If your balance is enough, you can create a balance checkout without paying the QR again. Admin approval is used to safely deduct the balance.</p></div>`}
window.walletPage=walletPage;
function addBalance(){view.innerHTML=`<button class="btn alt" onclick="walletPage()">← Back</button><div class="card fade"><h2>💰 Add Balance</h2><p class="muted">Pay via PhonePe and submit proof. Admin verifies it before balance becomes available.</p><img class="qr" src="qr_code.png"><p style="text-align:center"><b>${esc(settings.upi)}</b></p><input id="amount" class="input" type="number" min="1" placeholder="Enter amount"><label class="file">📸 Select Screenshot<input id="bproof" type="file" accept="image/*"></label><img id="bprev" class="preview"><button class="btn" id="bsubmit">Submit Balance Request</button></div>`;document.getElementById("bproof").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{bprev.src=r.result;bprev.style.display="block"};r.readAsDataURL(f)};document.getElementById("bsubmit").onclick=submitBalance}
async function submitBalance(){const a=Number(document.getElementById("amount").value),f=document.getElementById("bproof").files[0];if(!a||!f)return toast("Amount & screenshot required");const btn=document.getElementById("bsubmit");btn.disabled=true;const image=await compress(f),r=push(ref(db,"balanceRequests"));await update(ref(db),{["balanceRequests/"+r.key]:{requestId:r.key,userId,amount:a,status:"pending",screenshot:image,createdAt:Date.now()},["userBalanceRequests/"+userId+"/"+r.key]:{requestId:r.key,userId,amount:a,status:"pending",createdAt:Date.now()}});view.innerHTML=`<div class="hero">✅ Balance request submitted.<p class="muted">Request #${esc(r.key)} is pending verification.</p><button class="btn" onclick="walletPage()">Back to Wallet</button></div>`}
function help(){nav("help");view.innerHTML=`<div class="hero fade"><h1>☎ Help Center</h1><p class="muted">Need help with an order or payment?</p><button class="btn" onclick='open("https://wa.me/91"+encodeURIComponent(settings.whatsapp),"_blank")'>📱 WhatsApp Owner</button></div><div class="card"><b>UPI</b><p class="muted">${esc(settings.upi)}</p><b>Payment</b><p class="muted">Submit a clear payment screenshot. Your order remains private to your account.</p></div>`}
window.help=help;window.orders=orders;window.wallet=walletPage;
init();
</script>
</body></html>
