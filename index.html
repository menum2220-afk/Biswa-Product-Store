<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISWA MODS STORE</title><style>

</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🛒</div><div><b>BISWA MODS STORE</b><small>Fast • Secure • Premium</small></div></div><div class="bal">Balance<b id="balance">₹0</b></div></header><main id="v" class="view"></main><div id="toast" class="toast"></div><nav class="nav"><button data-p="home">⌂<br>Home</button><button data-p="shop">🛒<br>Shop</button><button data-p="orders">📦<br>Orders</button><button data-p="wallet">💰<br>Balance</button><button data-p="help">💬<br>Help</button></nav></div>
<script type="module">

const firebaseConfig={

authDomain:"biswamodsstore.firebaseapp.com",

const DEFAULT_PRODUCTS=[
{id:"biswa_mods_product",name:"BISWA MODS PRODUCT",icon:"🔥",sub:"Premium access",plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},

const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);await signInAnonymously(auth);const V=document.querySelector("#v");let P=DEFAULT_PRODUCTS,S={upi:"7099517202-ve6a@ybl",whatsapp:"7099517202",announcement:"Welcome to BISWA MODS STORE!"};
const E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),M=n=>"₹"+Number(n||0).toLocaleString("en-IN");
function toast(t){let x=document.querySelector("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}function nav(n){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.p===n));({home,shop,orders,wallet,help}[n])()}
document.querySelectorAll(".nav button").forEach(x=>x.onclick=()=>nav(x.dataset.p));onValue(ref(db,"settings"),s=>S={...S,...(s.val()||{})});onValue(ref(db,"products"),s=>{if(s.exists())P=Object.values(s.val())});onValue(ref(db,"users/"+auth.currentUser.uid+"/balance"),s=>document.querySelector("#balance").textContent=M(s.val()||0));
function home(){navx("home");V.innerHTML=`<div class="hero"><span class="tag">ONLINE</span><span class="tag">24/7 ORDER</span><h1>Premium access, simple checkout.</h1><p class="muted">Choose product → plan → PhonePe → screenshot → admin verification → key.</p><button class="btn" id="go">🛒 Browse Products</button><button class="btn alt" id="wa">📱 WhatsApp Owner</button></div><div class="card"><b>📢 Announcement</b><p class="muted">${E(S.announcement)}</p></div><div class="card"><b>✨ Store Features</b><p class="muted">Live orders • wallet balance • payment proof • key delivery • download link • support</p></div>`;go.onclick=shop;wa.onclick=()=>open("https://wa.me/917099517202","_blank")}
function navx(n){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.p===n))}
function shop(){navx("shop");V.innerHTML=`<div class="hero"><h1>🛍️ Products</h1><p class="muted">Choose your product.</p></div>`+P.filter(p=>p.enabled!==false).map((p,i)=>`<div class="card"><div style="font-size:20px">${E(p.icon||"📦")} <b>${E(p.name)}</b></div><p class="muted">${E(p.sub||"Premium access")}</p><button class="btn" data-i="${i}">View Plans</button></div>`).join("");V.querySelectorAll(".btn").forEach(b=>b.onclick=()=>plans(P.filter(p=>p.enabled!==false)[b.dataset.i]))}
function plans(p){navx("shop");V.innerHTML=`<button class="btn alt" id="back">← Back</button><div class="hero"><h1>${E(p.icon||"📦")} ${E(p.name)}</h1><p class="muted">${E(p.sub||"Choose a plan")}</p></div><div class="grid">${(p.plans||[]).map((x,i)=>`<div class="plan" data-i="${i}">⏳ <b>${E(x[0])}</b><br><span class="price">${M(x[1])}</span><br><small class="muted">Tap to buy</small></div>`).join("")}</div>`;back.onclick=shop;V.querySelectorAll(".plan").forEach(b=>b.onclick=()=>checkout(p,p.plans[b.dataset.i]))}
function checkout(p,x){navx("shop");V.innerHTML=`<button class="btn alt" id="back">← Change Plan</button><div class="card"><b>🧾 Order Summary</b><p class="muted">📦 ${E(p.name)}<br>⏳ ${E(x[0])}<br>💰 <span class="price">${M(x[1])}</span></p><img class="qr" src="qr_code.png"><div style="text-align:center"><b>${E(S.upi)}</b><p class="muted">Scan & Pay Using PhonePe</p></div><label class="file">📸 Select Payment Screenshot<input id="pf" type="file" accept="image/*"></label><img id="pv" class="preview"><button class="btn" id="send">Submit Payment Proof</button></div>`;back.onclick=()=>plans(p);pf.onchange=e=>showFile(e.target.files[0],pv);send.onclick=()=>submit(p,x)}
function showFile(f,img){if(!f)return;let r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display="block"};r.readAsDataURL(f)}
function compress(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let i=new Image;i.onload=()=>{let c=document.createElement("canvas"),s=Math.min(1,420/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.58))};i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
async function submit(p,x){let f=pf.files[0];if(!f)return toast("Screenshot select karo");if(f.size>8e6)return toast("Image too large");send.disabled=true;send.textContent="Uploading...";try{let image=await compress(f),r=push(ref(db,"orders"));await set(r,{orderId:r.key,userId:auth.currentUser.uid,productId:p.id,product:p.name,plan:x[0],amount:Number(x[1]),screenshot:image,orderStatus:"pending",paymentStatus:"pending",key:"",downloadLink:"",createdAt:Date.now()});V.innerHTML=`<div class="hero">✅ <b>Order Submitted</b><p class="muted">Order ID: #${E(r.key)}<br>Status: <span class="status pending">PENDING</span></p><button class="btn" id="mo">📦 My Orders</button></div>`;mo.onclick=orders}catch(e){console.error(e);toast("Submit failed");send.disabled=false;send.textContent="Submit Payment Proof"}}
async function orders(){navx("orders");V.innerHTML=`<div class="hero"><h1>📦 My Orders</h1><p class="muted">Loading...</p></div>`;let q=query(ref(db,"orders"),orderByChild("userId"),equalTo(auth.currentUser.uid)),s=await get(q);if(!s.exists()){V.innerHTML='<div class="card" style="text-align:center">No orders yet.</div>';return}V.innerHTML=Object.values(s.val()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(o=>{let c=o.orderStatus==="approved"?"approved":o.orderStatus==="rejected"?"rejected":"pending";return `<div class="card"><b>#${E(o.orderId)}</b> <span class="status ${c}">${E((o.orderStatus||"pending").toUpperCase())}</span><p class="muted">📦 ${E(o.product)}<br>⏳ ${E(o.plan)}<br>💰 ${M(o.amount)}</p>${o.key?`<div class="card">🔑 <b>${E(o.key)}</b></div>`:""}${o.downloadLink?`<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${E(o.downloadLink)}" target="_blank">📥 Download</a>`:""}${o.rejectReason?`<p style="color:#ff9299">${E(o.rejectReason)}</p>`:""}</div>`}).join("")}
function wallet(){navx("wallet");V.innerHTML=`<div class="hero"><h1>💰 Add Balance</h1><p class="muted">Pay via PhonePe and submit proof. Admin verifies it.</p></div><div class="card"><img class="qr" src="qr_code.png"><p style="text-align:center"><b>${E(S.upi)}</b></p><input id="amt" class="input" type="number" placeholder="Enter amount"><label class="file">📸 Select Screenshot<input id="bf" type="file" accept="image/*"></label><img id="bp" class="preview"><button class="btn" id="bs">Request Balance</button></div>`;bf.onchange=e=>showFile(e.target.files[0],bp);bs.onclick=async()=>{let a=Number(amt.value),f=bf.files[0];if(!a||!f)return toast("Amount & screenshot required");bs.disabled=true;try{let image=await compress(f),r=push(ref(db,"balanceRequests"));await set(r,{requestId:r.key,userId:auth.currentUser.uid,amount:a,status:"pending",screenshot:image,createdAt:Date.now()});V.innerHTML=`<div class="hero">✅ Balance request submitted.<br>Request ID: #${E(r.key)}<br>Amount: ${M(a)}</div>`}catch(e){toast("Failed");bs.disabled=false}}}
function help(){navx("help");V.innerHTML=`<div class="hero"><h1>💬 Help Center</h1><p class="muted">Payment/order problem?</p><button class="btn" id="wa">📱 Contact Owner on WhatsApp</button></div><div class="card"><b>Payment</b><p class="muted">Pay only to the UPI shown by the store and upload proof.</p><b>Delivery</b><p class="muted">Approved keys and download links appear in My Orders.</p></div>`;wa.onclick=()=>open("https://wa.me/917099517202","_blank")}
home();
