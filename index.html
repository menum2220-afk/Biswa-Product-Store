<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BISWA MODS STORE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110d;color:#eafff1;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#0b1712,#050806)}
header{padding:18px 16px;border-bottom:1px solid #183d29;position:sticky;top:0;background:#09140fdd;backdrop-filter:blur(12px);z-index:5}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:#83a792;margin-top:4px}
#chat{padding:18px 14px 95px}.msg{max-width:92%;padding:13px 14px;border-radius:16px;margin:10px 0;line-height:1.45;white-space:pre-line}
.bot{background:#10251a;border:1px solid #1d5735;border-bottom-left-radius:5px}
.user{margin-left:auto;background:#155c35;border-bottom-right-radius:5px}
.card{background:#0c1c13;border:1px solid #1d5735;border-radius:18px;padding:14px;margin:10px 0}
button{width:100%;border:0;border-radius:12px;padding:12px;margin:5px 0;background:#18a957;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
button.alt{background:#123d27;border:1px solid #2a7146}.price{font-weight:700;color:#72f5a3}.muted{color:#86a892;font-size:12px}
input{width:100%;padding:12px;border-radius:11px;border:1px solid #28553a;background:#07110d;color:#fff;margin:5px 0}
#file{display:none}.filebtn{display:block;text-align:center;background:#123d27;border:1px solid #2a7146;padding:12px;border-radius:12px;margin:5px 0;cursor:pointer}
#preview{max-width:100%;max-height:260px;border-radius:12px;display:none;margin:8px auto}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;padding:10px;background:#07110ff2;border-top:1px solid #183d29;display:flex;gap:8px}
.nav button{margin:0}.danger{background:#7b2525}
</style>
</head>
<body>
<div class="app">
<header><h1>🛒 BISWA MODS STORE</h1><div class="sub">Fast • Simple • Secure Order System</div></header>
<div id="chat"></div>
<div class="nav">
<button onclick="home()">🏠 Home</button>
<button onclick="orders()">📦 Orders</button>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,push,set,get,query,orderByChild,equalTo} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyDI3RApVY98KNDRQS0QbWgguuD7zq4OPwo",
 authDomain:"biswamodsstore.firebaseapp.com",
 projectId:"biswamodsstore",
 storageBucket:"biswamodsstore.firebasestorage.app",
 messagingSenderId:"195493411755",
 appId:"1:195493411755:web:01124cc4986160f707b0ee"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),storage=getStorage(app),auth=getAuth(app);
await signInAnonymously(auth).catch(e=>console.error(e));

const products=[
{name:"BISWA MODS PRODUCT",plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},
{name:"BISWA MODS PRODUCT V2",plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},
{name:"BISWA PRODUCT",plans:[["3 Days",50],["8 Days",100],["15 Days",150],["30 Days",270]]}
];
const chat=document.getElementById("chat");
const qr="assets/qr_code.png";
let selected=null,selectedPlan=null;

function bubble(text,type="bot"){let d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
function clear(){chat.innerHTML=""}
window.home=home;window.orders=orders;

function home(){
 clear();bubble("🤖 Welcome to BISWA MODS STORE!\n\nChoose an option below:");
 let c=document.createElement("div");c.className="card";
 c.innerHTML='<button id="shop">🛒 SHOP NOW</button><button class="alt" id="support">💬 SUPPORT</button>';
 chat.appendChild(c);
 document.getElementById("shop").onclick=showProducts;
 document.getElementById("support").onclick=()=>bubble("💬 Support: Contact the store owner through your official support channel.","bot");
}
function showProducts(){
 clear();bubble("🛒 Select Product");
 products.forEach((p,i)=>{
  let c=document.createElement("div");c.className="card";
  c.innerHTML=`<b>${p.name}</b><br><span class="muted">${p.plans.length} access plans available</span><button>Choose Product</button>`;
  c.querySelector("button").onclick=()=>showPlans(i);chat.appendChild(c);
 });
}
function showPlans(i){
 selected=products[i];clear();bubble("🛒 "+selected.name+"\n🛍️ Choose your access plan:");
 selected.plans.forEach((p,j)=>{
  let c=document.createElement("div");c.className="card";
  c.innerHTML=`<b>⏳ ${p[0]}</b> — <span class="price">₹${p[1].toLocaleString("en-IN")}</span><button>Buy Now</button>`;
  c.querySelector("button").onclick=()=>payment(i,j);chat.appendChild(c);
 });
}
function payment(i,j){
 selected=products[i];selectedPlan=selected.plans[j];clear();
 bubble(`🧾 Order Details\n\n📦 ${selected.name}\n⏳ ${selectedPlan[0]}\n💰 ₹${selectedPlan[1].toLocaleString("en-IN")}\n\n📲 Pay using PhonePe QR below.`);
 let c=document.createElement("div");c.className="card";
 c.innerHTML=`<img src="${qr}" style="width:100%;border-radius:12px"><p class="muted">UPI: 7099517202-ve6a@ybl</p><p class="muted">After payment, upload your payment screenshot.</p><label class="filebtn">📸 Select Payment Screenshot<input id="file" type="file" accept="image/*"></label><img id="preview"><button id="submit">Submit Payment Proof</button><button class="alt" id="back">← Back</button>`;
 chat.appendChild(c);
 document.getElementById("file").onchange=e=>{
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();r.onload=()=>{let p=document.getElementById("preview");p.src=r.result;p.style.display="block"};r.readAsDataURL(f);
 };
 document.getElementById("back").onclick=()=>showPlans(i);
 document.getElementById("submit").onclick=()=>submitOrder();
}
async function submitOrder(){
 const file=document.getElementById("file").files[0];
 if(!file){alert("Payment screenshot select karo.");return}
 const btn=document.getElementById("submit");btn.disabled=true;btn.textContent="Uploading...";
 try{
  const orderRef=push(ref(db,"orders"));
  const orderId=orderRef.key;
  const path="payment_screenshots/"+orderId+"_"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const snap=await uploadBytes(sref(storage,path),file);
  const url=await getDownloadURL(snap.ref);
  const order={
   orderId,userId:auth.currentUser.uid,product:selected.name,plan:selectedPlan[0],
   amount:selectedPlan[1],paymentStatus:"pending",orderStatus:"pending",
   screenshot:url,key:"",downloadLink:"",createdAt:Date.now()
  };
  await set(orderRef,order);
  clear();bubble("✅ Payment proof submitted successfully!\n\nOrder ID: "+orderId+"\n\n⏳ Status: Pending\n\nAdmin payment verify karega. Approval ke baad key aur download link yahin show hoga.");
 }catch(e){console.error(e);alert("Order submit nahi hua: "+e.message);btn.disabled=false;btn.textContent="Submit Payment Proof"}
}
async function orders(){
 clear();bubble("📦 Your Orders");
 if(!auth.currentUser){bubble("Please wait and try again.");return}
 const q=query(ref(db,"orders"),orderByChild("userId"),equalTo(auth.currentUser.uid));
 const snap=await get(q);
 if(!snap.exists()){bubble("Abhi koi order nahi mila.");return}
 Object.values(snap.val()).reverse().forEach(o=>{
  let c=document.createElement("div");c.className="card";
  c.innerHTML=`<b>#${o.orderId}</b><br>📦 ${o.product}<br>⏳ ${o.plan}<br>💰 ₹${o.amount}<br>📌 Status: <b>${o.orderStatus}</b>${o.key?`<br>🔑 Key: <b>${o.key}</b>`:""}${o.downloadLink?`<br><a href="${o.downloadLink}" target="_blank" style="color:#72f5a3">📥 Download</a>`:""}`;
  chat.appendChild(c);
 });
}
home();
</script>
</body>
</html>
