<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BISWA MODS STORE</title>
<meta name="theme-color" content="#06130d">
<style>
:root{--bg:#050a07;--panel:#0a1510;--panel2:#0e2016;--line:#1c4c31;--green:#20e879;--green2:#0ea85b;--text:#effff5;--muted:#89a995;--red:#ff5e67;--yellow:#ffd35a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#124d2b 0,#07130d 30%,#030705 70%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
body{overflow-x:hidden}.app{max-width:560px;margin:auto;min-height:100vh;position:relative;background:linear-gradient(180deg,#08150eec,#040806)}
.header{position:sticky;top:0;z-index:20;padding:13px 15px;border-bottom:1px solid #164328;background:#06110cde;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#21ed7d,#08743d);display:grid;place-items:center;font-size:22px;box-shadow:0 0 25px #18e87844}.brand b{font-size:15px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.balance{padding:9px 11px;border:1px solid #256c43;background:#0c2518;border-radius:13px;text-align:right;font-size:11px}.balance b{color:#7affae;font-size:13px}
#chat{padding:18px 13px 105px}.row{display:flex;gap:8px;align-items:flex-end;margin:11px 0}.row.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:10px;background:#123923;display:grid;place-items:center;font-size:14px;flex:none}.bubble{max-width:86%;padding:13px 14px;border:1px solid #1c4b30;background:#0d1d14;border-radius:18px 18px 18px 5px;box-shadow:0 7px 25px #0005;line-height:1.48;font-size:14px}.user .bubble{background:#12633a;border-color:#269a5a;border-radius:18px 18px 5px 18px}.time{font-size:9px;color:#7e9a88;margin-top:6px}.card{background:linear-gradient(180deg,#0d1d14,#09150f);border:1px solid #1b4a2f;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 30px #0006}.title{font-weight:800;font-size:15px}.muted{color:var(--muted);font-size:12px}.price{color:#70ffab;font-weight:800}.btn{border:0;border-radius:13px;padding:12px 13px;margin:5px 0;width:100%;font-weight:800;color:#fff;background:linear-gradient(135deg,#20d96f,#0b984d);cursor:pointer;box-shadow:0 8px 18px #08b75b25}.btn.secondary{background:#102d1d;border:1px solid #276743}.btn.danger{background:#70252c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.plan{padding:13px;border:1px solid #1d4e32;border-radius:14px;background:#0b1b12;cursor:pointer}.plan:hover{border-color:#36dc7d}.qr{display:block;width:100%;max-width:360px;margin:12px auto;border-radius:18px;background:white;padding:10px}.input{width:100%;background:#06100b;border:1px solid #24543a;border-radius:12px;color:#fff;padding:12px;outline:none}.input:focus{border-color:#38e47f}.file{display:block;padding:12px;border:1px dashed #328052;border-radius:12px;text-align:center;color:#8ee7ad;cursor:pointer;margin:8px 0}.file input{display:none}.preview{width:100%;max-height:260px;object-fit:contain;border-radius:14px;display:none;margin:8px 0}.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#050c08f2;border-top:1px solid #17452c;backdrop-filter:blur(15px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav{border:0;background:#0b1d13;color:#8eab99;border-radius:12px;padding:9px 4px;font-size:10px;font-weight:700}.nav.active{color:#fff;background:#123c25}.toast{position:fixed;z-index:50;top:74px;left:50%;transform:translateX(-50%);background:#10271a;border:1px solid #2a7147;padding:10px 14px;border-radius:13px;display:none;font-size:12px;box-shadow:0 12px 35px #0008}.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7cf5a7;margin:0 2px;animation:b .8s infinite alternate}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes b{to{opacity:.2;transform:translateY(-3px)}}.status{padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800;display:inline-block}.pending{background:#5b4914;color:#ffe58a}.approved{background:#104f2c;color:#7affad}.rejected{background:#5d2027;color:#ff9ba1}.help{color:#77f4a7;text-decoration:none}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">🛒</div><div><b>BISWA MODS STORE</b><span>Premium digital store</span></div></div><div class="balance">Balance<br><b id="balance">₹0</b></div></header>
<div id="chat"></div>
<div id="toast" class="toast"></div>
<nav class="bottom">
<button class="nav active" data-tab="home">🏠<br>Home</button><button class="nav" data-tab="shop">🛒<br>Shop</button><button class="nav" data-tab="orders">📦<br>Orders</button><button class="nav" data-tab="wallet">💰<br>Balance</button>
</nav>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getDatabase,ref,push,set,get,query,orderByChild,equalTo,onValue} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDI3RApVY98KNDRQS0QbWgguuD7zq4OPwo",
  authDomain: "biswamodsstore.firebaseapp.com",
  databaseURL: "https://biswamodsstore-default-rtdb.firebaseio.com",
  projectId: "biswamodsstore",
  storageBucket: "biswamodsstore.firebasestorage.app",
  messagingSenderId: "195493411755",
  appId: "1:195493411755:web:01124cc4986160f707b0ee"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),storage=getStorage(app),auth=getAuth(app);
await signInAnonymously(auth).catch(console.error);
const PRODUCTS = [
  {
    id: "biswa_mods_product",
    name: "BISWA MODS PRODUCT",
    emoji: "🔥",
    description: "Premium access plan",
    plans: [
      ["1 Hour", 50], ["3 Hours", 100], ["6 Hours", 150], ["12 Hours", 200],
      ["1 Day", 280], ["2 Days", 530], ["3 Days", 830], ["5 Days", 1300], ["7 Days", 1780]
    ]
  },
  {
    id: "biswa_mods_product_v2",
    name: "BISWA MODS PRODUCT V2",
    emoji: "⚡",
    description: "V2 premium access plan",
    plans: [
      ["1 Hour", 50], ["3 Hours", 100], ["6 Hours", 150], ["12 Hours", 200],
      ["1 Day", 280], ["2 Days", 530], ["3 Days", 830], ["5 Days", 1300], ["7 Days", 1780]
    ]
  },
  {
    id: "biswa_product",
    name: "BISWA PRODUCT",
    emoji: "💎",
    description: "Long-duration access",
    plans: [
      ["3 Days", 50], ["8 Days", 100], ["15 Days", 150], ["30 Days", 270]
    ]
  }
];
const chat=document.querySelector("#chat"), balanceEl=document.querySelector("#balance"), qr="./assets/qr_code.png";
let state={product:null,plan:null};
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sound(type="click"){try{const A=new AudioContext(),o=A.createOscillator(),g=A.createGain();o.frequency.value=type==="send"?660:type==="ok"?880:420;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.07)}catch{}}
function toast(t){const x=document.querySelector("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function msg(text,who="bot",typing=false){const row=document.createElement("div");row.className="row "+who;row.innerHTML=`${who==="bot"?'<div class="avatar">🤖</div>':''}<div class="bubble">${typing?'<div class="typing"><span></span><span></span><span></span></div>':text}<div class="time">${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div></div>`;chat.appendChild(row);chat.scrollTop=chat.scrollHeight;sound(who==="user"?"send":"click");return row}
function card(html){const d=document.createElement("div");d.className="card";d.innerHTML=html;chat.appendChild(d);return d}
function clear(){chat.innerHTML=""}
function nav(tab){document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));({home,shop,orders,wallet}[tab]||home)()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
async function loadBalance(){if(!auth.currentUser)return;onValue(ref(db,"users/"+auth.currentUser.uid+"/balance"),s=>{balanceEl.textContent=money(s.val()||0)})}
function home(){clear();msg("👋 Welcome to BISWA MODS STORE!<br><br>Choose a product, select a plan and submit your payment proof. Your order is manually verified by admin.<br><br>⚡ Fast order tracking<br>🔐 Secure Firebase backend<br>💬 WhatsApp support");const c=card(`<button class="btn" id="s">🛒 Shop Products</button><button class="btn secondary" id="w">💰 Add Balance</button><button class="btn secondary" id="wa">📱 Contact Owner on WhatsApp</button>`);c.querySelector("#s").onclick=()=>shop();c.querySelector("#w").onclick=()=>wallet();c.querySelector("#wa").onclick=()=>window.open("https://wa.me/917099517202","_blank")}
function shop(){clear();msg("🛒 Select a product:");PRODUCTS.forEach((p,i)=>{const c=card(`<div class="title">${p.emoji} ${esc(p.name)}</div><div class="muted">${esc(p.description)}</div><button class="btn">View Plans</button>`);c.querySelector("button").onclick=()=>plans(i)})}
function plans(i){state.product=PRODUCTS[i];clear();msg(`${state.product.emoji} ${esc(state.product.name)}<br>🛍️ Choose your access plan:`);const g=card('<div class="grid"></div>');const grid=g.firstElementChild;state.product.plans.forEach((p,j)=>{const d=document.createElement("div");d.className="plan";d.innerHTML=`<b>⏳ ${esc(p[0])}</b><br><span class="price">${money(p[1])}</span><br><span class="muted">Tap to continue</span>`;d.onclick=()=>payment(i,j);grid.appendChild(d)})}
function payment(i,j){state.product=PRODUCTS[i];state.plan=state.product.plans[j];clear();msg(`🧾 Order Summary<br><br>📦 ${esc(state.product.name)}<br>⏳ ${esc(state.plan[0])}<br>💰 <b>${money(state.plan[1])}</b>`);const c=card(`<div class="muted">Scan this QR with PhonePe</div><img class="qr" src="${qr}" alt="PhonePe QR" onerror="this.outerHTML='<div style=&quot;padding:30px;text-align:center;color:#ff8c93&quot;>QR image not found. Put qr_code.png inside STORE_BOT/assets/</div>'"><div style="text-align:center"><b>UPI: 7099517202-ve6a@ybl</b></div><p class="muted">After payment, upload the screenshot below.</p><label class="file">📸 Select Payment Screenshot<input id="proof" type="file" accept="image/*"></label><img class="preview" id="prev"><button class="btn" id="send">Submit Payment Proof</button><button class="btn secondary" id="back">← Back</button>`);c.querySelector("#proof").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=c.querySelector("#prev");p.src=r.result;p.style.display="block"};r.readAsDataURL(f)};c.querySelector("#back").onclick=()=>plans(i);c.querySelector("#send").onclick=submitOrder}
async function submitOrder(){const f=document.querySelector("#proof").files[0];if(!f)return toast("Screenshot select karo");const b=document.querySelector("#send");b.disabled=true;b.textContent="Uploading...";try{const r=push(ref(db,"orders"));const path=`payment_screenshots/${r.key}_${Date.now()}.jpg`;const up=await uploadBytes(sref(storage,path),f,{contentType:f.type});const url=await getDownloadURL(up.ref);await set(r,{orderId:r.key,userId:auth.currentUser.uid,productId:state.product.id,product:state.product.name,plan:state.plan[0],amount:state.plan[1],paymentStatus:"pending",orderStatus:"pending",screenshot:url,key:"",downloadLink:"",createdAt:Date.now()});sound("ok");clear();msg(`✅ Payment proof submitted.<br><br>Order ID: <b>#${esc(r.key)}</b><br>📌 Status: <span class="status pending">PENDING</span><br><br>Admin verify karega. Approval ke baad key aur download link yahin milega.`)}catch(e){console.error(e);toast("Upload failed: "+e.message);b.disabled=false;b.textContent="Submit Payment Proof"}}
async function orders(){clear();msg("📦 Your Orders");const q=query(ref(db,"orders"),orderByChild("userId"),equalTo(auth.currentUser.uid));const s=await get(q);if(!s.exists()){card("No orders yet.");return}Object.values(s.val()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(o=>{const cls=o.orderStatus==="approved"?"approved":o.orderStatus==="rejected"?"rejected":"pending";card(`<b>#${esc(o.orderId)}</b><br>📦 ${esc(o.product)}<br>⏳ ${esc(o.plan)} · ${money(o.amount)}<br><span class="status ${cls}">${esc((o.orderStatus||"pending").toUpperCase())}</span>${o.key?`<hr>🔑 <b>${esc(o.key)}</b>`:""}${o.downloadLink?`<br><a class="help" href="${esc(o.downloadLink)}" target="_blank">📥 Download</a>`:""}${o.rejectReason?`<br><span class="muted">Reason: ${esc(o.rejectReason)}</span>`:""}`)})}
function wallet(){clear();msg("💰 Balance Center<br><br>You can request a balance top-up by paying to the same UPI and submitting proof. Admin will manually approve the requested amount.");const c=card(`<div class="title">Current Balance: <span class="price">${balanceEl.textContent}</span></div><img class="qr" src="${qr}" alt="PhonePe QR"><div style="text-align:center"><b>UPI: 7099517202-ve6a@ybl</b></div><input class="input" id="amt" type="number" min="1" placeholder="Enter amount"><label class="file">📸 Select Payment Screenshot<input id="walletProof" type="file" accept="image/*"></label><img class="preview" id="walletPrev"><button class="btn" id="walletSend">Request Balance</button>`);c.querySelector("#walletProof").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=c.querySelector("#walletPrev");p.src=r.result;p.style.display="block"};r.readAsDataURL(f)};c.querySelector("#walletSend").onclick=submitWallet}
async function submitWallet(){const amount=Number(document.querySelector("#amt").value),f=document.querySelector("#walletProof").files[0];if(!amount||amount<1||!f)return toast("Amount aur screenshot dono do");const b=document.querySelector("#walletSend");b.disabled=true;b.textContent="Uploading...";try{const r=push(ref(db,"balanceRequests"));const up=await uploadBytes(sref(storage,`balance_proofs/${r.key}_${Date.now()}.jpg`),f,{contentType:f.type});await set(r,{requestId:r.key,userId:auth.currentUser.uid,amount,status:"pending",screenshot:await getDownloadURL(up.ref),createdAt:Date.now()});clear();msg(`💰 Balance request submitted.<br><br>Request ID: <b>#${r.key}</b><br>Amount: <b>${money(amount)}</b><br><span class="status pending">PENDING</span>`)}catch(e){toast(e.message);b.disabled=false;b.textContent="Request Balance"}}
loadBalance();home();
</script>
</body></html>
