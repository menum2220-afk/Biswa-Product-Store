<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISWA MODS STORE V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020604;color:#effff6;font-family:system-ui;min-height:100vh}.bg{position:fixed;inset:0;z-index:-2}.bg video{width:100%;height:100%;object-fit:cover;filter:brightness(.28)}.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(#03120aaa,#000b)}main{max-width:850px;margin:auto;padding:12px 12px 90px}.top,.msg,.panel,.nav{background:#06130dcc;border:1px solid #25f58a44;backdrop-filter:blur(18px);box-shadow:0 10px 35px #0008}.top{position:sticky;top:8px;z-index:5;border-radius:20px;padding:12px;display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:#12b968;display:grid;place-items:center;font-weight:900}.title{flex:1}.title b{display:block}.title small{color:#9bb7aa}.bal{border:1px solid #25f58a44;border-radius:12px;padding:9px}.msg{margin:10px 0;padding:13px;border-radius:18px 18px 18px 5px;animation:in .3s}.msg.me{margin-left:auto;border-radius:18px 18px 5px 18px;background:#0b3825cc}.panel{padding:10px;border-radius:18px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{width:100%;padding:13px;border-radius:14px;border:1px solid #25f58a44;background:#071d12dd;color:#effff6;font-weight:800;text-align:left;cursor:pointer;transition:.18s}.btn:active{transform:scale(.97)}.price{color:#25f58a}.muted{color:#9bb7aa;font-size:12px}img{max-width:100%}.qr{display:block;width:min(290px,100%);margin:10px auto;background:white;padding:10px;border-radius:14px}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 20px));padding:7px;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);z-index:8}.nav button{background:transparent;border:0;color:#b8d2c5;padding:7px;font-size:11px}.typing span{display:inline-block;width:6px;height:6px;background:#25f58a;border-radius:50%;margin:0 2px;animation:d 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes d{50%{transform:translateY(-5px);opacity:.4}}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}input{width:100%;padding:13px;border-radius:12px;border:1px solid #25f58a44;background:#03100a;color:white;margin:5px 0 9px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="bg"><video id="v" src="assets/video.mp4" autoplay muted loop playsinline></video></div><div class="shade"></div>
<main><div class="top"><div class="logo">B</div><div class="title"><b>BISWA MODS STORE</b><small>Premium Store V2</small></div><div class="bal" id="bal">₹0.00</div></div><section id="chat"></section></main>
<div class="nav"><button data-page="home">🏠<br>Home</button><button data-page="products">🛍️<br>Products</button><button data-page="orders">📦<br>Orders</button><button data-page="profile">👤<br>Profile</button></div>
<audio id="sound" src="assets/music.mp3"></audio>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get,set,push,update,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyDI3RApVY98KNDRQS0QbWgguuD7zq4OPwo",authDomain:"biswamodsstore.firebaseapp.com",projectId:"biswamodsstore",storageBucket:"biswamodsstore.firebasestorage.app",messagingSenderId:"195493411755",appId:"1:195493411755:web:01124cc4986160f707b0ee"};
const db=getDatabase(initializeApp(cfg)),auth=getAuth(),UPI="7099517202-ve6a@ybl";let uid,user={},products={};
const defaults={product1:{name:"BISWA MODS PRODUCT",plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},product2:{name:"BISWA MODS PRODUCT V2",plans:[["1 Hour",50],["3 Hours",100],["6 Hours",150],["12 Hours",200],["1 Day",280],["2 Days",530],["3 Days",830],["5 Days",1300],["7 Days",1780]]},product3:{name:"BISWA PRODUCT",plans:[["3 Days",50],["8 Days",100],["15 Days",150],["30 Days",270]]}};
const chat=document.querySelector("#chat"),bal=document.querySelector("#bal");function money(x){return"₹"+Number(x||0).toFixed(2)}function snd(){document.querySelector("#sound").play().catch(()=>{})}document.addEventListener("click",()=>document.querySelector("#v").play().catch(()=>{}),{once:true});
function msg(t,me=false){let d=document.createElement("div");d.className="msg"+(me?" me":"");d.innerHTML=t;chat.append(d);d.scrollIntoView({behavior:"smooth"});return d}
async function bot(t){let d=msg('<div class="typing"><span></span><span></span><span></span></div>');await new Promise(r=>setTimeout(r,350));d.remove();msg(t)}
function menu(){let d=document.createElement("div");d.className="panel grid";d.innerHTML='<button class="btn" data-a="products">🛍️ Products<br><span class="muted">Choose access plan</span></button><button class="btn" data-a="balance">💰 My Balance</button><button class="btn" data-a="add">➕ Add Balance</button><button class="btn" data-a="orders">📦 My Orders</button><button class="btn" data-a="support">💬 Support</button><button class="btn" data-a="announce">📢 Announcement</button>';chat.append(d)}
function home(){chat.innerHTML="";msg("<b>👋 Welcome to BISWA MODS STORE V2</b><br>Premium access & wallet store.");bot("Choose an option below 👇");setTimeout(menu,400)}
function productList(){chat.innerHTML="";msg("<b>🛒 Products</b><br>Choose a product.");let d=document.createElement("div");d.className="panel grid";Object.entries(products).forEach(([id,p])=>{if(p.enabled===false)return;let b=document.createElement("button");b.className="btn";b.dataset.p=id;b.innerHTML="🛍️ "+p.name+"<br><span class=muted>Select access plan</span>";d.append(b)});chat.append(d)}
function plans(id){let p=products[id]||defaults[id];chat.innerHTML="";msg("<b>🛒 "+p.name+"</b><br>🛍️ Choose your access plan:");let d=document.createElement("div");d.className="panel";(p.plans||[]).forEach(x=>{let b=document.createElement("button");b.className="btn";b.style.marginBottom="8px";b.dataset.buy=JSON.stringify({productId:id,product:p.name,plan:x[0],amount:x[1]});b.innerHTML="⏳ "+x[0]+" <span class=price>🪙 "+money(x[1])+"</span>";d.append(b)});chat.append(d)}
async function checkout(o){chat.innerHTML="";msg("<b>🧾 Order</b><br>"+o.product+"<br>"+o.plan+" — <b>"+money(o.amount)+"</b>");let d=document.createElement("div");d.className="panel";d.innerHTML='<button class="btn" id="wallet">💰 Pay from Balance</button><button class="btn" id="qr" style="margin-top:8px">📱 Pay by PhonePe QR</button>';chat.append(d);d.querySelector("#wallet").onclick=async()=>{if(Number(user.balance||0)<o.amount)return msg("❌ Insufficient balance.");let id=push(ref(db,"orders")).key;let order={...o,orderId:id,userId:uid,status:"approved",paymentMethod:"balance",createdAt:Date.now()};await update(ref(db,"users/"+uid),{balance:Number(user.balance)-o.amount});await set(ref(db,"orders/"+id),order);await set(ref(db,"userOrders/"+uid+"/"+id),order);showOrders()};d.querySelector("#qr").onclick=async()=>{let id=push(ref(db,"orders")).key;let order={...o,orderId:id,userId:uid,status:"pending",paymentMethod:"qr",createdAt:Date.now()};await set(ref(db,"orders/"+id),order);await set(ref(db,"userOrders/"+uid+"/"+id),order);chat.innerHTML="";msg("<b>📱 PhonePe Payment</b><br>Amount: "+money(o.amount)+"<br>UPI: "+UPI+'<img class="qr" src="assets/qr_code.png" onerror="this.src='assets/qr_code.svg'"><span class=muted>After payment, submit your screenshot through the admin support process. Order ID: '+id+"</span>")}}
function add(){chat.innerHTML="";msg("<b>➕ Add Balance</b><br>Enter amount.");let d=document.createElement("div");d.className="panel";d.innerHTML='<input id="amt" type="number" min="1" placeholder="₹ Amount"><button class="btn" id="go">Continue</button>';chat.append(d);d.querySelector("#go").onclick=async()=>{let amount=Number(d.querySelector("#amt").value);if(!amount)return;let id=push(ref(db,"balanceRequests")).key;let r={requestId:id,userId:uid,amount,status:"pending",createdAt:Date.now(),upi:UPI};await set(ref(db,"balanceRequests/"+id),r);await set(ref(db,"userBalanceRequests/"+uid+"/"+id),r);chat.innerHTML="";msg("<b>💳 Balance Request</b><br>Amount: "+money(amount)+'<img class="qr" src="assets/qr_code.png" onerror="this.src='assets/qr_code.svg'"><br><span class=muted>Pay and submit proof to admin. Request ID: '+id+"</span>")}}
async function showOrders(){chat.innerHTML="";msg("<b>📦 My Orders</b>");let s=await get(ref(db,"userOrders/"+uid)),x=s.val()||{};let a=Object.values(x);if(!a.length)return msg("No orders yet.");a.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(o=>msg("<b>"+o.product+"</b><br>"+o.plan+" • "+money(o.amount)+"<br>Status: "+(o.status||"pending")+(o.key?"<br>🔑 Key: <b>"+o.key+"</b>":"")+(o.downloadLink?'<br><a target=_blank href="'+o.downloadLink+'">⬇️ Download</a>':""))}
function balance(){chat.innerHTML="";msg("<b>💰 My Balance</b><br>Available: <span class=price>"+money(user.balance)+"</span>");menu()}function support(){chat.innerHTML="";msg('<b>💬 Support</b><br><a class=btn style="display:block;text-decoration:none" target=_blank href="https://wa.me/917099517202">📲 WhatsApp — 7099517202</a>')}async function announce(){let s=await get(ref(db,"settings/announcement"));chat.innerHTML="";msg("<b>📢 Announcement</b><br>"+(s.val()||"No announcement."))}
function profile(){chat.innerHTML="";msg("<b>👤 Profile</b><br>Anonymous account<br><span class=muted>"+uid+"</span>")}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;snd();if(b.dataset.page==="home")home();if(b.dataset.page==="products")productList();if(b.dataset.page==="orders")showOrders();if(b.dataset.page==="profile")profile();if(b.dataset.a==="products")productList();if(b.dataset.a==="balance")balance();if(b.dataset.a==="add")add();if(b.dataset.a==="orders")showOrders();if(b.dataset.a==="support")support();if(b.dataset.a==="announce")announce();if(b.dataset.p)plans(b.dataset.p);if(b.dataset.buy)checkout(JSON.parse(b.dataset.buy))});
onAuthStateChanged(auth,async u=>{if(!u)return;uid=u.uid;let r=ref(db,"users/"+uid),s=await get(r);if(!s.exists())await set(r,{uid,balance:0,createdAt:Date.now()});onValue(r,x=>{user=x.val()||{};bal.textContent=money(user.balance)});onValue(ref(db,"products"),x=>products=x.val()||defaults);home()});signInAnonymously(auth);
</script></body></html>
